[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "workflows"
version = "0.1.0"
description = "Run agent workflows through Pi, program them with DSPy, improve them with GEPA"
requires-python = ">=3.13"
dependencies = ["dspy==3.3.1", "gepa==0.1.4"]

[project.scripts]
workflows = "workflows.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
